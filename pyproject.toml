[project]
name = "leadform-demo"
version = "0.1.0"
description = "Lead form demo: website form to Telegram and CSV"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.35",
    "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
